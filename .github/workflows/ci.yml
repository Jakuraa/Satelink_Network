name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript check
        run: |
          set -o pipefail
          cd apps/web && npx tsc --noEmit 2>&1 | tail -60

      - name: Lint
        run: |
          set -o pipefail
          npm run lint --if-present 2>&1 | tail -60

      # Honest-positioning gate (Phase 7): fails the job on any finding. Deliberately NOT piped
      # through tail/head, so the script's exit code is the step's exit code.
      - name: Claims lint (satelink.network)
        working-directory: apps/web
        run: npm run lint:claims

      - name: Claims lint (jakuraa.com)
        working-directory: apps/corporate
        run: npm run lint:claims

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests
        run: |
          set -o pipefail
          npm test --if-present 2>&1 | tail -80
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only

  baseline:
    name: API Test Baseline Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Fails ONLY on test failures outside apps/api/test/known-failures-baseline.txt
      # (pre-existing failures + entries that need CDP facilitator creds / a real
      # DB to pass — see the annotated groups in the baseline file).
      - name: Baseline guard
        run: bash scripts/ci-baseline-check.sh
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
          # Dummy: validateEnv() hard-exits without DATABASE_URL. Nothing
          # listens on this port — DB tests fail fast and deterministically
          # and are covered by the baseline allowlist.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:54329/ci_test

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for leaked secrets
        run: |
          # Check for common secret patterns
          if grep -rE "(sk_(live|test)_[A-Za-z0-9]{32,}|gsk_[A-Za-z0-9]{32,})" \
            --include="*.js" --include="*.ts" --include="*.mjs" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude="*.test.*" --exclude="*.spec.*" \
            . 2>/dev/null | \
            grep -v "crypto.randomBytes\|startsWith\|placeholder\|YOUR_KEY\|process.env\|REPLACE\|randomBytes\|toString\|stress_test\|backfill\|cz_backfill"; then
            echo "::error::Possible secrets found in code"
            exit 1
          fi
          echo "No secrets detected"

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, test]
    # No `develop` branch exists — the old `github.ref == 'refs/heads/develop'`
    # half of this condition never fires; this job runs on PRs targeting main.
    if: github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build frontend
        run: |
          set -o pipefail
          cd apps/web
          NODE_ENV=production npm run build 2>&1 | tail -60
        env:
          NEXT_PUBLIC_WALLETCONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_ID }}

      - name: Report build size
        run: |
          echo "Build complete"
          du -sh apps/web/.next 2>/dev/null || echo "Build output not found"
